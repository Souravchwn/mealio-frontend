<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#161513">
    <meta name="robots" content="noindex">
    <title>Offline · Mealtill</title>
    <style>
        :root {
            --bg: #f7f4ee;
            --card: #ffffff;
            --text: #1f1b16;
            --muted: #5e554a;
            --border: #e6e0d5;
            --lime: #c4f04d;
            --on-lime: #1a2e05;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #161513;
                --card: #1c1a18;
                --text: #efe9de;
                --muted: #aaa398;
                --border: #2c2a26;
            }
        }
        * { box-sizing: border-box; margin: 0; }
        html, body { height: 100%; }
        body {
            display: grid;
            place-items: center;
            padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Bengali", sans-serif;
            line-height: 1.5;
        }
        main {
            width: 100%;
            max-width: 380px;
            padding: 32px 24px;
            border: 1px solid var(--border);
            border-radius: 24px;
            background: var(--card);
            text-align: center;
        }
        .mark {
            display: inline-grid;
            place-items: center;
            width: 64px;
            height: 64px;
            margin-bottom: 20px;
            border-radius: 18px;
            background: var(--lime);
        }
        h1 { font-size: 1.35rem; line-height: 1.25; }
        p { margin-top: 8px; color: var(--muted); font-size: 0.95rem; }
        .bn { margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--border); }
        .bn h2 { font-size: 1.1rem; }
        button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 48px;
            width: 100%;
            margin-top: 24px;
            border: 0;
            border-radius: 999px;
            background: var(--lime);
            color: var(--on-lime);
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }
        button:focus-visible { outline: 3px solid #4d7c0f; outline-offset: 3px; }
        .status { margin-top: 12px; font-size: 0.85rem; min-height: 1.3em; }
    </style>
</head>
<body>
    <main>
        <span class="mark" aria-hidden="true">
            <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#1a2e05" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/>
            </svg>
        </span>
        <h1>You are offline</h1>
        <p>Mealtill needs the internet to show live meals and balances. Nothing you did was lost.</p>
        <div class="bn" lang="bn">
            <h2>ইন্টারনেট সংযোগ নেই</h2>
            <p>লাইভ মিল আর হিসাব দেখাতে Mealtill-এর ইন্টারনেট লাগে। আপনার কোনো কাজ হারায়নি।</p>
        </div>
        <button type="button" id="retry">Try again · আবার চেষ্টা করুন</button>
        <p class="status" id="status" role="status" aria-live="polite"></p>
    </main>
    <script>
        (function () {
            var status = document.getElementById("status");
            function retry() {
                status.textContent = "Checking… · দেখা হচ্ছে…";
                location.reload();
            }
            document.getElementById("retry").addEventListener("click", retry);
            // Come back by itself as soon as the connection returns
            window.addEventListener("online", retry);
        })();
    </script>
</body>
</html>
